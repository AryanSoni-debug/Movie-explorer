<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieExplorer Pro | Neon Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍿</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toast-container"></div>

    <div class="ambient-glow"></div>

    <header>
        <div class="container header-content">
            <div class="logo" onclick="location.reload()">
                <i class="fas fa-play-circle logo-icon"></i> 
                <span>Movie<span class="highlight">Explorer</span></span>
            </div>
            
            <div class="search-section">
                <div class="search-bar-wrapper">
                    <div class="search-bar">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="searchInput" placeholder="Find your next obsession...">
                        <button id="micBtn" class="mic-btn" title="Voice Search"><i class="fas fa-microphone"></i></button>
                    </div>
                    <button id="searchBtn" class="main-search-btn">Search</button>
                </div>
                <div id="searchHistory" class="history-chips"></div>
            </div>

            <div class="header-actions">
                <button id="watchlistBtn" class="icon-btn" title="My Watchlist">
                    <i class="fas fa-heart"></i> <span class="btn-text">Watchlist</span>
                </button>
            </div>
        </div>
    </header>

    <div class="container controls-bar">
        <div class="filter-group">
            <label class="filter-radio">
                <input type="radio" name="type" value="" checked>
                <span>All</span>
            </label>
            <label class="filter-radio">
                <input type="radio" name="type" value="movie">
                <span>Movies</span>
            </label>
            <label class="filter-radio">
                <input type="radio" name="type" value="series">
                <span>Series</span>
            </label>
            <label class="filter-radio">
                <input type="radio" name="type" value="game">
                <span>Games</span>
            </label>
        </div>

        <div class="sort-wrapper">
            <i class="fas fa-sort-amount-down"></i>
            <select id="sortOptions" disabled>
                <option value="default" selected>Sort By: Relevance</option>
                <option value="year_desc">Year (Newest)</option>
                <option value="year_asc">Year (Oldest)</option>
                <option value="rating_desc">Rating (High to Low)</option>
            </select>
        </div>
    </div>

    <main class="container">
        <div id="loader" class="hidden">
            <div class="loader-wave">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <p>Scanning the multiverse...</p>
        </div>

        <div id="fallbackMessage" class="hidden status-msg warning"></div>
        <div id="errorMessage" class="hidden status-msg error"></div>
        
        <h2 id="sectionTitle" class="section-title hidden">My Watchlist</h2>

        <div id="movieGrid" class="grid-layout">
            </div>

        <div class="load-more-container">
            <button id="loadMoreBtn" class="hidden">
                <span>Load More</span>
                <i class="fas fa-chevron-down"></i>
            </button>
        </div>
    </main>

    <div id="movieModal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="close-btn">&times;</button>
            <div id="modalBody" class="modal-body-content"></div>
        </div>
    </div>

    <div class="fab-container" onclick="triggerSurprise()">
        <div class="fab-circle">
            <i class="fas fa-magic"></i>
        </div>
        <span class="fab-tooltip">Surprise Me!</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
